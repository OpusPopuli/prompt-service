# =============================================================================
# Release — Build, Push, Sign & SBOM
# =============================================================================
#
# Triggered by pushing a `v*` tag. Builds the prompt-service Docker image,
# pushes to GHCR, signs with Sigstore keyless cosign, and generates + attaches
# an SPDX SBOM.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Tag-triggered rather than push-to-main. Under trunk-based development every
# feature lands on main, so a branches:[main] trigger would publish `:latest` on
# every merge — turning a routine merge into a production image with no
# deliberate step in between.
#
# It also gives this repo a release record it has never had: no git tag and no
# GitHub Release has ever existed here, and package.json still reads 0.1.0.
# Releases were plain develop→main merges, so there was nothing to point at when
# asking what shipped. Now the tag IS the release.
#
# Matches the opuspopuli monorepo release.yml shape so verification tooling and
# pinned action SHAs are consistent across repos.
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']

permissions:
  # `contents: write` (not read) because anchore/sbom-action attaches the
  # generated SBOM to the GitHub Release for the tag — a release-asset
  # upload, which the GITHUB_TOKEN can only do with contents:write. With
  # read, the v0.3.0 run failed at "Attaching SBOMs to release" with
  # "Resource not accessible by integration" AFTER the image was already
  # pushed and signed — a half-shipped release. Everything this workflow
  # writes is still confined to: the release's assets, GHCR, and
  # attestations.
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/opuspopuli

jobs:
  build-sign-publish:
    name: Build, Sign & Publish — prompt-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # QEMU enables cross-arch builds on amd64 GitHub runners. Required
      # for the arm64 leg of the multi-arch build below — without it,
      # buildx fails when emitting arm64 layers from an amd64 host.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/prompt-service
          tags: |
            # v0.2.0 -> 0.2.0. Gives the image a version matching the git tag,
            # so "what is running" is answerable from the image alone — which
            # it has never been in this repo.
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: .
          file: Dockerfile
          # Multi-arch: amd64 for Linux CI / x86_64 servers, arm64 for
          # Apple Silicon Mac Studios. Mirrors the same fix made in
          # opuspopuli#858 for the main backend image set. Without
          # arm64 here, ghcr.io operators on M-series Macs hit:
          #   "no matching manifest for linux/arm64/v8 in the manifest
          #    list entries"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.IMAGE_PREFIX }}/prompt-service@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/prompt-service@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-prompt-service.spdx.json

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom-prompt-service.spdx.json \
            --type spdxjson \
            "${{ env.IMAGE_PREFIX }}/prompt-service@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: sbom-prompt-service
          path: sbom-prompt-service.spdx.json
          retention-days: 90
